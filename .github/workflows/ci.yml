name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt || pip install pytest

    - name: Run Test Suite
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v

    - name: Test Headless Simulation Run
      run: |
        python main.py --headless --ticks 50 --seed 42 --csv ci_test.csv --json ci_test.json

    - name: Test Telemetry Analytics CLI
      run: |
        python Alife_Simulation/analyze.py --csv ci_test.csv --no-plot
